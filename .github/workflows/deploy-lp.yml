name: Deploy landing pages a GitHub Pages

on:
  push:
    branches: [main]
    paths: ['landing-pages/**', '.github/workflows/deploy-landing-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artefacto (solo landing-pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
