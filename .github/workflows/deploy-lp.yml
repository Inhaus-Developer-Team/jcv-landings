name: Deploy landing pages a GitHub Pages

on:
  push:
    branches: [main]
    paths: ['voluntarios.html', 'pedir-ayuda.html', '.github/workflows/deploy-lp.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto
        run: |
          mkdir -p _site
          cp voluntarios.html pedir-ayuda.html README.md _site/
          touch _site/.nojekyll
      - name: Upload artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
